{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row">
        <!-- Left Side: Image -->
        <div class="col-md-6">
            <img src="https://res.cloudinary.com/dftwpyllt/image/upload/v1738837813/female-blood-donor-card-animated-icon-download-in-lottie-json-gif-static-svg-file-formats--donation-id-pack-healthcare-medical-icons-10032986_xofl8a.gif" 
                 alt="Donate Blood" class="img-fluid rounded">
        </div>

        <!-- Right Side: Form -->
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Donate Blood</h3>
                    
                    <!-- Success & Error Messages -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-danger{% endif %}" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form action="{% url 'donate' %}" method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <input type="text" class="form-control" id="address" name="address" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="age" class="form-label">Age</label>
                                <input type="number" class="form-control" id="age" name="age" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="gender" class="form-label">Gender</label>
                                <select class="form-select" id="gender" name="gender" required>
                                    <option value="" selected disabled>Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="weight" class="form-label">Weight (kg)</label>
                                <input type="number" class="form-control" id="weight" name="weight" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="blood_group" class="form-label">Blood Group</label>
                                <select class="form-select" id="blood_group" name="blood_group" required>
                                    <option value="" selected disabled>Select</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="disease" class="form-label">Any Disease (if applicable)</label>
                            <input type="text" class="form-control" id="disease" name="disease" placeholder="Mention if you have any health issues">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="phone" name="phone" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="donation_preference" class="form-label">Donation Preference</label>
                            <select class="form-select" id="donation_preference" name="donation_preference" required>
                                <option value="" selected disabled>Select</option>
                                <option value="Urgent">Urgent</option>
                                <option value="Blood Bank">Blood Bank</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-danger w-100">Donate Now</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
