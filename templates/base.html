<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Blood Donation - Save Lives Now">
<meta property="og:description" content="Join our blood donation platform to connect donors with those in urgent need. Register today and save a life!"> 
<meta property="og:url" content="https://blood-donation-gray.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Blood Donation">
    <title>BloodLink Brotherhood Society</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* General Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Styles */
        .navbar {
            background-color: #F7F7F8;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            height: 100px; /* Increased navbar height */
            padding: 10px 0;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #222 !important;
            line-height: 1.2;
        }

        .navbar-brand img {
            height: 80px; /* Logo size auto-increases */
            width: auto;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-text span {
            display: block;
            font-size: 18px;
            font-weight: 700;
        }

        .brand-text .title {
            font-size: 22px;
            font-weight: 800;
            color: #d9534f; /* Highlight BloodLink */
        }

        .brand-text .subtitle {
            font-size: 16px;
            color: #444;
        }

        .navbar-nav .nav-link {
            font-size: 18px;
            font-weight: 700; /* Bold fonts */
            
            margin: 0 12px;
            transition: all 0.3s ease-in-out;
        }

        .navbar-nav .nav-link:hover {
            color: #d9534f !important;
        }

        .navbar-toggler {
            border: none;
            outline: none;
        }

        /* Footer Styles */
        .footer {
            background-color: #F7F7F8;
            color: #222;
            text-align: center;
            padding: 15px 0;
            margin-top: auto; /* Sticky footer effect */
            font-weight: 500;
            font-size: 16px;
            box-shadow: 0px -4px 6px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 991px) {
            .navbar {
                height: auto;
                padding: 15px;
            }
            .navbar-brand {
                flex-direction: row;
                align-items: center;
                text-align: left;
            }
            .brand-text {
                margin-left: 10px;
                text-align: left;
            }
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 5px rgba(255, 0, 0, 0.5); }
            50% { box-shadow: 0 0 15px rgba(255, 0, 0, 1); }
            100% { box-shadow: 0 0 5px rgba(255, 0, 0, 0.5); }
        }
        .pulse-animation {
            animation: pulse 1s infinite alternate;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <!-- Logo and Brand -->
                <a class="navbar-brand" href="#">
                    <img src="https://res.cloudinary.com/dftwpyllt/image/upload/v1738819466/logo_sr3jii.png" alt="Logo">
                </a>
                    <div class="brand-text">
                        <span class="title">BloodLink</span>
                        <span class="subtitle">Brotherhood Society</span>
                    </div>
               

                <!-- Mobile Toggle Button -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navbar Links -->
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link {% if request.path == '/' %}text-danger {% endif %}" href="{% url "home" %}">Home</a></li>
                        <li class="nav-item"><a class="nav-link {% if request.path == '/about/' %}text-danger {% endif %}" href="{% url "about" %}">About</a></li>
                        <li class="nav-item"><a class="nav-link {% if request.path == '/contact/' %}text-danger {% endif %}" href="{% url "contact" %}">Contact</a></li>
                        <li class="nav-item"><a class="nav-link {% if request.path == '/donate/' %}text-danger {% endif %}" href="{% url "donate" %}">Donate</a></li>
                        <li class="nav-item"><a class="nav-link {% if request.path == '/news/' %}text-danger {% endif %}" href="{% url "news" %}">News</a></li>
                        <li class="nav-item">
                            <a class="nav-link btn btn-danger fw-bold pulse-animation {% if request.path == '/required/' %}text-danger {% endif %}" href="{% url "required" %}">Urgent Cases</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content (Dummy Content for Spacing) -->
   {% block content %}{% endblock content %}

    <!-- Sticky Footer -->
    <footer class="footer">
        © 2024 BloodLink Brotherhood Society | All Rights Reserved
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
    
</body>
</html>
