{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row">
        <!-- Left Side: Image -->
        <div class="col-md-6">
            <img src="https://res.cloudinary.com/dftwpyllt/image/upload/v1738837538/blood-donor-team-animated-icon-download-in-lottie-json-gif-static-svg-file-formats--donation-pack-healthcare-medical-icons-10032991_ib61cm.gif" alt="Contact Image" class="img-fluid rounded">
        </div>

        <!-- Right Side: Form -->
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Contact Us</h3>
                    
                    {% if messages %}
                        <div class="alert alert-success" role="alert">
                            {% for message in messages %}
                                {{ message }}
                            {% endfor %}
                        </div>
                    {% endif %}
                    
                    <form action="" method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" name="phone">
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
